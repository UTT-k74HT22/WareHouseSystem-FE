name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - staging
    paths:
      - 'src/**'
      - 'package*.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - 'nginx/**'
      - '.github/workflows/fe-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/whs-frontend

jobs:
  build-and-test:
    name: Build & Verify Angular
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --configuration production

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/whs-frontend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Deploy to Server (163.61.72.183)
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/whs-frontend' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '163.61.72.183' }}
          username: ${{ secrets.SERVER_USER || 'devops' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "==== Deploying WHS Frontend ===="
            cd /opt/whs/deploy

            # Login to GHCR (supports GHCR_TOKEN or GITHUB_TOKEN)
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin

            # Pull latest frontend image
            IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "Pulling $IMAGE_REF..."
            docker pull "$IMAGE_REF"

            # Recreate frontend container
            echo "Recreating frontend container..."
            FE_IMAGE="$IMAGE_REF" docker compose -f docker-compose.vps.yml up -d --no-deps --force-recreate frontend

            # Actively poll healthcheck
            echo "Waiting for frontend (whs_fe) to become healthy..."
            TIMEOUT=60
            ELAPSED=0
            STATUS=""
            while [ $ELAPSED -lt $TIMEOUT ]; do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' whs_fe 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✓ Frontend container (whs_fe) is healthy after ${ELAPSED}s!"
                break
              elif [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                echo "✗ Frontend container entered $STATUS state!"
                docker logs --tail 100 whs_fe
                exit 1
              fi
              echo "Status: $STATUS (${ELAPSED}/${TIMEOUT}s)..."
              sleep 3
              ELAPSED=$((ELAPSED + 3))
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "✗ Timed out waiting for frontend to become healthy."
              docker logs --tail 100 whs_fe
              exit 1
            fi

            # Reload Nginx upstream connections to avoid 502 Bad Gateway
            echo "Reloading Nginx upstream resolution..."
            docker exec whs_nginx nginx -s reload || docker compose -f docker-compose.vps.yml restart nginx || true

            # Prune dangling Docker images
            docker image prune -f || true

            echo "==== Frontend deployment successfully completed! ===="
